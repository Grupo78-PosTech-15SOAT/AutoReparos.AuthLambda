name: CI - AutoReparos.AuthLambda

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lambda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.10.5
      - run: dotnet restore AutoReparos.AuthLambda.slnx
      - run: dotnet build AutoReparos.AuthLambda.slnx -c Release --no-restore
      - run: dotnet test AutoReparos.AuthLambda.slnx -c Release --no-build --verbosity normal
      - name: Validate Terraform
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
