name: CI - AutoReparos.AuthLambda

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Compilação e Testes (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore AutoReparos.AuthLambda.slnx

      - name: Build Solution
        run: dotnet build AutoReparos.AuthLambda.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AutoReparos.AuthLambda.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
