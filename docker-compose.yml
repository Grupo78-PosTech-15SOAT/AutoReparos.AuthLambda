# Docker Compose - AutoReparos.AuthLambda (Local Testing Environment)
services:
  auth-lambda:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoreparos-auth-lambda
    restart: "no"
    environment:
      - Cadastros__BaseUrl=${CADASTROS_BASE_URL:-http://host.docker.internal:8080}
      - Cadastros__ChaveInterna=${CHAVE_INTERNA:?defina CHAVE_INTERNA (o mesmo segredo X-Chave-Interna do Cadastros)}
    networks:
      - autoreparos-lambda-network

networks:
  autoreparos-lambda-network:
    driver: bridge
